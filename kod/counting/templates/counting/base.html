<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Подсчёт автомобилей{% endblock %}</title>
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'counting/css/style.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'counting:index' %}">Vehicle Counting</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'counting:index' %}">Главная</a>
        <a class="nav-link" href="{% url 'counting:process' %}">Обработка видео</a>
        <a class="nav-link" href="{% url 'counting:history' %}">История</a>
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
